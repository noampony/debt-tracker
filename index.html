<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1d4ed8" />
    <link rel="icon" type="image/png" href="/debt-tracker-logo.png" />
    <link rel="apple-touch-icon" href="/debt-tracker-logo.png" />

    <!-- Resolve the color theme before paint to avoid a flash of the wrong theme -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          // Default to dark when the user has not made an explicit choice.
          var theme = stored === "light" || stored === "dark" ? stored : "dark";
          document.documentElement.setAttribute("data-theme", theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "dark" ? "#15315e" : "#1d4ed8");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&display=swap"
    />

    <title>החזרתי?</title>

    <!-- Open Graph / WhatsApp link preview -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="__APP_URL__" />
    <meta property="og:site_name" content="החזרתי?" />
    <meta property="og:title" content="החזרתי?" />
    <meta property="og:description" content="מעקב חובות פשוט עם חברים ומשפחה" />
    <meta property="og:image" content="__APP_URL__/link-preview.jpg" />
    <meta property="og:image:secure_url" content="__APP_URL__/link-preview.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="הלוגו של החזרתי?" />
    <meta property="og:locale" content="he_IL" />

    <!-- Twitter / iMessage fallback -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="החזרתי?" />
    <meta name="twitter:description" content="מעקב חובות פשוט עם חברים ומשפחה" />
    <meta name="twitter:image" content="__APP_URL__/link-preview.jpg" />
    <meta name="twitter:image:alt" content="הלוגו של החזרתי?" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
